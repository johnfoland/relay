name: Release

# release-please keeps a release PR open that bumps the version in
# plugins/relay/.claude-plugin/plugin.json and updates CHANGELOG.md from
# Conventional Commits. Merging it tags vX.Y.Z and creates the GitHub release;
# Claude Code and Codex see the new version on their next marketplace update.

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # A PR opened with the built-in GITHUB_TOKEN waits for a maintainer
          # to approve its CI run. RELEASE_PLEASE_TOKEN (a fine-grained PAT:
          # this repo, Contents and Pull requests read/write) avoids that;
          # until it is set this falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: master
